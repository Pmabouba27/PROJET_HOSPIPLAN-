services:

  db:
    image: postgres:15
    container_name: hospiplan_db
    env_file: .env   # POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./hospiplan
    container_name: hospiplan_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./hospiplan:/app
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=hospiplan.settings
      - DB_HOST=db   # nom du conteneur postgres
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: hospiplan_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data: